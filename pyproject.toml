[project]
name = "claspin"
version = "0.0.1"
description = "A catalog of metrics for DevOps engineers"
authors = [
    {name = "Vincent Primault"},
]
dependencies = [
    "pydantic>=2.6.4",
    "PyYAML>=6.0.1",
    "starlark-pyo3>=2024.1.4",
    "httpx>=0.27.2",
    "click>=8.1.7",
    "pytz>=2024.2",
    "fastapi>=0.115.5",
    "uvicorn[standard]>=0.32.1",
]
requires-python = ">=3.12,<3.13"
readme = "README.md"
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Repository = "https://github.com/pvcnt/claspin.git"
Issues = "https://github.com/pvcnt/claspin/issues"

[project.optional-dependencies]
db = [
    "opendal>=0.45.1",
]
plot = [
    "PythonMonkey>=0.4.0",
]

[project.scripts]
claspin = "claspin.cli:cli"

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[tool.pdm]
distribution = true

[tool.pytest.ini_options]
addopts = """
--asyncio-mode=auto
"""

[dependency-groups]
dev = [
    "ruff>=0.4.0",
    "pytest>=8.3.3",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.24.0",
    "pyright>=1.1.389",
    "pytest-httpx>=0.34.0",
]
